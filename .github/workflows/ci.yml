name: Pull Request Quality Gates

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Lint, types, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Deno for Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:edge
      - run: pnpm test:unit
      - run: pnpm test:design-system
      - name: Self-test release checkers
        run: pnpm test:quality-tools

  release-artifact:
    name: Build, links, freshness, and security
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:links
      - run: pnpm test:freshness
      - run: pnpm test:security
      - name: Upload verified dist for browser checks
        uses: actions/upload-artifact@v4
        with:
          name: pr-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  accessibility:
    name: Accessibility browser checks
    needs: release-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download verified dist
        uses: actions/download-artifact@v4
        with:
          name: pr-dist-${{ github.sha }}
          path: dist
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
