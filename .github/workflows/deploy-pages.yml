name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Deno for Edge Functions
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Type-check Supabase Edge Functions
        run: pnpm typecheck:edge

      - name: Run unit tests
        run: pnpm test:unit

      - name: Validate design-system contracts
        run: pnpm test:design-system

      - name: Self-test release checkers
        run: pnpm test:quality-tools

      - name: Build static site
        run: pnpm build

      - name: Verify internal links
        run: pnpm test:links

      - name: Verify content freshness
        run: pnpm test:freshness

      - name: Verify release security boundary
        run: pnpm test:security

      - name: Install Chromium for accessibility checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify accessibility routes
        run: pnpm test:a11y

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Preserve exact rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true

  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify deployed site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout smoke-test tools
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run production smoke test
        env:
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
        run: node scripts/v2/smoke-test.mjs --base-url "$DEPLOYED_URL" --attempts 6 --retry-delay-ms 5000
