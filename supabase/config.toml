project_id = "sichentao-platform-kernel"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "100MiB"

# Every function performs endpoint-specific verification. Checkout and portal require a
# live Supabase user token; the webhook requires a Stripe signature; signed content may
# be public or authenticated depending on RLS.
[functions.create-checkout]
verify_jwt = false

[functions.customer-portal]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.signed-content-url]
verify_jwt = false
