<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clean multilingual reader for daily frontier digests, with English as the canonical text and Chinese/Japanese comparison modes."
    />
    <link rel="canonical" href="https://sichentao.github.io/frontier-digest/" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta property="og:title" content="Daily Frontier Digest" />
    <meta
      property="og:description"
      content="Swipeable frontier research summaries, history, filters, and paragraph-level multilingual reading."
    />
    <meta property="og:url" content="https://sichentao.github.io/frontier-digest/" />
    <meta property="og:type" content="website" />
    <title>Daily Frontier Digest</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        const themeCatalog = {
          tohoku: "#f5f5f7",
          toyama: "#f5f5f7",
          usst: "#f5f5f7",
        };
        try {
          const savedLocale = localStorage.getItem("sichen-homepage-locale");
          document.documentElement.lang =
            savedLocale === "zh" ? "zh-CN" : savedLocale === "ja" ? "ja" : "en";
          const savedTheme = localStorage.getItem("sichen-homepage-theme");
          const theme = themeCatalog[savedTheme] ? savedTheme : "tohoku";
          document.documentElement.dataset.theme = theme;
          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute("content", themeCatalog[theme]);
          }
        } catch {
          document.documentElement.lang = "en";
          document.documentElement.dataset.theme = "tohoku";
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260505-001454" />
    <link rel="stylesheet" href="/assets/shared/homepage-shell.css?v=20260505-001454" />
    <link rel="stylesheet" href="/assets/shared/homepage-frame.css?v=20260505-001454" />
    <script src="./data/digest-data.js?v=20260505-001454"></script>
    <script src="/assets/shared/homepage-i18n.js?v=20260505-001454"></script>
    <script src="/assets/shared/homepage-platform.js?v=20260505-001454"></script>
    <script src="/assets/shared/homepage-components.js?v=20260505-001454"></script>
    <script defer src="/assets/shared/homepage-shell.js?v=20260505-001454"></script>
    <script defer src="./app.js?v=20260505-001454"></script>
  </head>
  <body data-page="digest">
    <div class="page-wash"></div>

    <header class="shell site-header">
      <div class="header-tools">
        <div class="header-controls-anchor" aria-hidden="true"></div>
        <div class="header-controls" aria-label="Display controls">
          <div class="locale-switcher control-switcher" role="group" aria-label="Language"></div>
          <div class="theme-switcher control-switcher" role="group" aria-label="Color theme"></div>
        </div>
        <nav class="topnav" aria-label="Page navigation">
          <a href="./index.html" aria-current="page">
            <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-home"></use></svg>
            <span data-i18n="nav.home">Home</span>
          </a>
          <a href="./index.html#reader">
            <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-publications"></use></svg>
            <span data-i18n="nav.reader">Reader</span>
          </a>
          <a href="./index.html#archive">
            <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-timeline"></use></svg>
            <span data-i18n="nav.archive">History</span>
          </a>
          <a href="./index.html#topics">
            <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-keyword"></use></svg>
            <span data-i18n="nav.topics">Topics</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="shell digest-layout">
      <section class="digest-hero reveal" aria-labelledby="digest-title">
        <div class="digest-hero-copy">
          <p class="eyebrow" data-i18n="hero.kicker">Daily frontier reader</p>
          <h1 id="digest-title" data-i18n="hero.title">Frontier Digest</h1>
          <p class="digest-lede" data-i18n="hero.lede">
            English-first research notes, readable as cards, long-form articles, or paragraph-level multilingual comparison.
          </p>
        </div>
        <div class="digest-hero-meta" aria-label="Reader status">
          <div>
            <span data-i18n="hero.updatedLabel">Updated</span>
            <strong id="digest-updated">-</strong>
          </div>
          <div>
            <span data-i18n="hero.countLabel">Articles</span>
            <strong id="digest-count">0</strong>
          </div>
        </div>
      </section>

      <section class="digest-toolbar reveal" aria-label="Digest filters">
        <div class="digest-search-wrap">
          <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-keyword"></use></svg>
          <input id="digest-search" type="search" placeholder="Search titles, topics, tags, or text" />
        </div>
        <select id="digest-topic-filter" aria-label="Topic"></select>
        <select id="digest-mode" aria-label="Reading mode"></select>
        <button id="digest-reset" class="digest-icon-button" type="button" aria-label="Reset filters" title="Reset filters">
          <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-reset"></use></svg>
        </button>
      </section>

      <section class="digest-workbench reveal" id="reader" aria-label="Frontier digest reader">
        <aside class="digest-history" id="archive" aria-labelledby="history-title">
          <div class="digest-pane-head">
            <p class="eyebrow" data-i18n="history.kicker">Archive</p>
            <h2 id="history-title" data-i18n="history.title">History</h2>
          </div>
          <div id="digest-history-list" class="digest-history-list"></div>
        </aside>

        <section class="digest-feed" aria-labelledby="feed-title">
          <div class="digest-pane-head">
            <p class="eyebrow" id="topics" data-i18n="feed.kicker">Swipeable cards</p>
            <h2 id="feed-title" data-i18n="feed.title">Today and Recent Notes</h2>
          </div>
          <div class="digest-chip-row" id="digest-topic-chips" aria-label="Topic shortcuts"></div>
          <div id="digest-feed-list" class="digest-card-stack"></div>
        </section>

        <article class="digest-reader" id="digest-article" aria-live="polite"></article>
      </section>
    </main>
  </body>
</html>
