<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A portal-style reader for Zara Zhang's Follow Builders project: AI builder posts, podcasts, sources, and long-form reading flow."
    />
    <link rel="canonical" href="https://sichentao.github.io/follow-builders/" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta property="og:title" content="Follow Builders" />
    <meta
      property="og:description"
      content="A clean reader for Follow Builders, Not Influencers, built as a standalone homepage workspace."
    />
    <meta property="og:url" content="https://sichentao.github.io/follow-builders/" />
    <meta property="og:type" content="website" />
    <title>Follow Builders</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        const themeCatalog = {
          tohoku: "#f5f5f7",
          toyama: "#f5f5f7",
          usst: "#f5f5f7",
        };
        try {
          const savedLocale = localStorage.getItem("sichen-homepage-locale");
          document.documentElement.lang =
            savedLocale === "zh" ? "zh-CN" : savedLocale === "ja" ? "ja" : "en";
          const savedTheme = localStorage.getItem("sichen-homepage-theme");
          const theme = themeCatalog[savedTheme] ? savedTheme : "tohoku";
          document.documentElement.dataset.theme = theme;
          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute("content", themeCatalog[theme]);
          }
        } catch {
          document.documentElement.lang = "en";
          document.documentElement.dataset.theme = "tohoku";
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260507-190029" />
    <link rel="stylesheet" href="/assets/shared/homepage-shell.css?v=20260507-190029" />
    <link rel="stylesheet" href="/assets/shared/homepage-frame.css?v=20260507-190029" />
    <script src="./data/follow-builders-data.js?v=20260507-190029"></script>
    <script src="/assets/shared/homepage-i18n.js?v=20260507-190029"></script>
    <script src="/assets/shared/homepage-platform.js?v=20260507-190029"></script>
    <script src="/assets/shared/homepage-components.js?v=20260507-190029"></script>
    <script src="./data/follow-builders-translations.js?v=20260507-190029"></script>
    <script defer src="/assets/shared/homepage-shell.js?v=20260507-190029"></script>
    <script defer src="./app.js?v=20260507-190029"></script>
  </head>
  <body data-page="follow-builders">
    <div class="page-wash"></div>

    <header class="shell site-header">
      <div class="header-tools">
        <a class="fb-site-brand" href="./index.html" aria-label="Follow Builders">
          <span>Follow Builders</span>
          <small data-i18n="brand.note">Visualizing Zara Zhang's open-source project</small>
        </a>
        <div class="header-controls-anchor" aria-hidden="true"></div>
        <div class="header-controls" aria-label="Display controls">
          <div class="locale-switcher control-switcher" role="group" aria-label="Language"></div>
          <div class="theme-switcher control-switcher" role="group" aria-label="Color theme"></div>
        </div>
        <nav class="topnav" aria-label="Page navigation">
          <a href="./index.html#feed" aria-current="page">
            <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-publications"></use></svg>
            <span data-i18n="nav.feed">Home</span>
          </a>
          <a href="./index.html#github">
            <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-code"></use></svg>
            <span data-i18n="nav.github">GitHub</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="fb-layout">
      <section class="fb-toolbar reveal" aria-label="Feed controls">
        <div class="fb-search">
          <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-keyword"></use></svg>
          <input id="fb-search" type="search" placeholder="Search builders, posts, podcasts, or sources" />
        </div>
      </section>

      <section id="feed" class="fb-feed-page reveal" aria-label="Follow Builders feed">
        <div class="fb-feed-grid">
          <section class="fb-main-column" aria-labelledby="fb-feed-title">
            <div class="fb-section-head">
              <h2 id="fb-feed-title" data-i18n="feed.title">Latest from builders</h2>
              <div class="fb-heading-actions">
                <div id="fb-language-display" class="fb-language-display" role="group" aria-label="Displayed languages"></div>
                <button id="fb-reset" class="fb-icon-button" type="button" data-fb-display-reset="all" aria-label="Reset filters" title="Reset filters">
                  <svg class="ui-icon" aria-hidden="true"><use href="/academic/assets/icons/ui-icons.svg#icon-reset"></use></svg>
                </button>
              </div>
            </div>
            <div id="fb-story-list" class="fb-story-list"></div>
          </section>

          <aside class="fb-rail" id="sources" aria-labelledby="fb-sources-title">
            <section class="fb-rail-section">
              <h2 id="fb-sources-title" data-i18n="sources.title">Who it tracks</h2>
              <div id="fb-source-stats" class="fb-source-stats"></div>
            </section>
            <section class="fb-rail-section">
              <h3 data-i18n="sources.builders">AI builders on X</h3>
              <div id="fb-builder-list" class="fb-source-list"></div>
            </section>
            <section class="fb-rail-section">
              <h3 data-i18n="sources.podcasts">Podcasts</h3>
              <div id="fb-podcast-list" class="fb-source-list"></div>
            </section>
            <section class="fb-rail-section">
              <h3 data-i18n="sources.blogs">Official blogs</h3>
              <div id="fb-blog-list" class="fb-source-list"></div>
            </section>
            <section class="fb-rail-section fb-github-section" id="github">
              <h3 data-i18n="github.title">GitHub</h3>
              <div class="fb-github-list">
                <a class="fb-github-card" href="https://github.com/zarazhangrui/follow-builders">
                  <strong data-i18n="github.zaraTitle">Zara Zhang</strong>
                  <span data-i18n="github.zaraText">Original Follow Builders project</span>
                </a>
                <a class="fb-github-card" href="https://github.com/SichenTao">
                  <strong data-i18n="github.sichenTitle">Sichen Tao</strong>
                  <span data-i18n="github.sichenText">Homepage and research workspace</span>
                </a>
              </div>
            </section>
          </aside>
        </div>
      </section>

      <article id="article" class="fb-article-page reveal" hidden aria-live="polite"></article>
    </main>
  </body>
</html>
