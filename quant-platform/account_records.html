<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>收益总结</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/account.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar account-topbar">
        <div class="brand-block">
          <p class="eyebrow">Internal Quant Platform</p>
          <h1>收益总结</h1>
          <span>本地账本 · 模拟交易 · 手动记录</span>
        </div>
        <label class="environment-select">
          <span>交易环境</span>
          <select id="environment-mode-select" aria-label="交易环境">
            <option value="paper">模拟交易</option>
            <option value="live">实盘交易</option>
          </select>
        </label>
        <nav class="nav-tabs" aria-label="页面">
          <a href="./backtest_workbench.html">交易</a>
          <a href="./stock_selection.html">选股</a>
          <a id="terminal-link" href="./trading_terminal.html">交易终端</a>
          <a class="is-active" href="./account_records.html">收益总结</a>
        </nav>
        <div class="status-strip" id="account-status"></div>
      </header>

      <section class="simulation-clock" aria-label="模拟场景时间线">
        <div class="clock-summary">
          <span id="sim-clock-mode">模拟场景</span>
          <strong id="sim-clock-current">未生成时间线</strong>
          <p id="sim-clock-range">收益总结会跟随同一模拟时刻复核持仓、成交和盈亏。</p>
        </div>
        <div class="clock-center">
          <div class="clock-fields">
            <label class="field compact-field">
              <span>模拟粒度</span>
              <select id="frequency-select">
                <option value="5m">5分钟</option>
                <option value="15m">15分钟</option>
                <option value="30m">30分钟</option>
                <option value="60m">60分钟</option>
                <option value="120m">120分钟</option>
                <option value="1d">日线</option>
                <option value="1w">周线</option>
                <option value="1mo">月线</option>
              </select>
            </label>
            <label class="field compact-field">
              <span>步进间隔</span>
              <select id="step-interval-select">
                <option value="1">1步</option>
              </select>
            </label>
            <label class="field">
              <span>开始日期</span>
              <input id="start-date" type="text" />
            </label>
            <label class="field">
              <span>结束日期</span>
              <input id="end-date" type="text" />
            </label>
            <label class="field cash-field">
              <span>初始资金</span>
              <input id="initial-cash" inputmode="numeric" />
            </label>
            <div class="clock-actions">
              <button id="generate-timeline" type="button">生成时间线</button>
              <button id="time-prev" class="secondary" type="button">步退</button>
              <button id="time-next" type="button">步进</button>
              <button id="run-backtest" type="button">全自动运行</button>
              <button id="time-pause" class="secondary" type="button">暂停</button>
              <button id="time-reset" class="secondary" type="button">重置</button>
            </div>
          </div>
          <label class="clock-progress">
            <span id="sim-clock-progress-label">进度 0 / 0</span>
            <input id="time-progress" type="range" min="0" max="0" value="0" />
          </label>
        </div>
      </section>

      <section class="account-command command-bar" aria-label="账户命令">
        <label class="field">
          <span>账户模式</span>
          <select id="mode-select">
            <option value="paper">模拟账户</option>
            <option value="manual">手动记录</option>
            <option value="live">真实交易（只读保护）</option>
          </select>
        </label>
        <label class="field search-box">
          <span>股票代码 / 名称</span>
          <input id="symbol-input" autocomplete="off" placeholder="300632.SZ / 光莆股份" />
          <div id="symbol-suggestions" class="suggestions"></div>
        </label>
        <button id="open-symbol" type="button">进入终端</button>
        <button id="reset-account" class="secondary" type="button">重置模拟</button>
      </section>

      <section class="account-workbench">
        <div class="account-head">
          <div>
            <h2>账户总览</h2>
            <p id="account-meta"></p>
          </div>
          <strong id="account-pnl"></strong>
        </div>
        <div class="metric-grid account-metrics" id="account-metrics"></div>

        <section class="account-section">
          <div class="section-head">
            <div>
              <h2>当前持仓</h2>
              <p>点击任意股票可带着账户上下文进入交易终端。</p>
            </div>
          </div>
          <div id="positions-table" class="account-table-wrap"></div>
        </section>

        <section class="account-grid-panels">
          <div class="account-section">
            <div class="section-head">
              <h2>成交记录</h2>
              <p>本地持久化成交账本</p>
            </div>
            <div id="fills-table" class="account-table-wrap compact"></div>
          </div>
          <div class="account-section">
            <div class="section-head">
              <h2>订单状态</h2>
              <p>成交、拒单和保护拦截</p>
            </div>
            <div id="orders-table" class="account-table-wrap compact"></div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./js/accountRecordsPage.js"></script>
  </body>
</html>
