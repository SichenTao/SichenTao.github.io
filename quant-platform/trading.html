<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>A 股自动选股交易驾驶舱</title>
    <link rel="stylesheet" href="./trading.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Internal Quant Platform</p>
          <h1>A 股自动选股交易驾驶舱</h1>
        </div>
        <div class="status-strip" id="status-strip"></div>
      </header>

      <section class="toolbar" aria-label="策略和股票选择">
        <label class="field">
          <span>策略</span>
          <select id="strategy-select"></select>
        </label>
        <label class="field">
          <span>股票代码</span>
          <input id="symbol-input" autocomplete="off" placeholder="600000.SH" />
        </label>
        <button id="symbol-search" type="button">查看</button>
      </section>

      <section class="workspace">
        <aside class="panel strategy-panel">
          <div class="panel-head">
            <h2>策略菜单</h2>
            <p id="strategy-meta"></p>
          </div>
          <div id="strategy-list" class="strategy-list"></div>
        </aside>

        <section class="panel decision-panel">
          <div class="panel-head">
            <h2>当日选股与目标交易</h2>
            <p id="decision-meta"></p>
          </div>
          <div class="metric-row" id="decision-metrics"></div>
          <div class="split-grid">
            <div>
              <h3>入选股票</h3>
              <div id="selected-symbols" class="symbol-list"></div>
            </div>
            <div>
              <h3>目标仓位</h3>
              <div id="target-positions" class="orders"></div>
            </div>
          </div>
          <h3>候选排名</h3>
          <div id="candidate-table"></div>
        </section>

        <section class="panel market-panel">
          <div class="panel-head">
            <h2>5 分钟行情回放</h2>
            <p id="market-meta"></p>
          </div>
          <div class="replay-controls" aria-label="历史实时回放控制">
            <button id="replay-reset" type="button">从头</button>
            <button id="replay-prev" type="button">上一步</button>
            <button id="replay-play" type="button">播放</button>
            <button id="replay-next" type="button">下一步</button>
            <input id="replay-range" type="range" min="0" max="0" value="0" />
            <span id="replay-label">0 / 0</span>
          </div>
          <div class="quote-board" id="quote-board"></div>
          <div class="simulation-panel" id="simulation-panel"></div>
          <svg class="price-chart" id="price-chart" viewBox="0 0 720 280" role="img" aria-label="5 分钟价格走势"></svg>
          <div id="bar-tape" class="bar-tape"></div>
        </section>
      </section>
    </main>
    <script src="./trading.js"></script>
  </body>
</html>
