<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="YouTube Learner is a video learning reader for watching YouTube, reading along, and learning better inside Sichen Tao's homepage."
    />
    <link rel="canonical" href="https://sichentao.github.io/youtube-to-ebook/" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta property="og:title" content="YouTube Learner" />
    <meta
      property="og:description"
      content="Watch YouTube. Read along. Learn better."
    />
    <meta property="og:url" content="https://sichentao.github.io/youtube-to-ebook/" />
    <meta property="og:type" content="website" />
    <title>YouTube Learner</title>
    <link rel="icon" href="/academic-homepage/favicon.png" type="image/png" />
    <script>
      (function () {
        var themeCatalog = { tohoku: "#f5f5f7", toyama: "#f5f5f7", usst: "#f5f5f7" };
        try {
          var query = new URLSearchParams(window.location.search);
          var locale = query.get("lang") || localStorage.getItem("sichen-homepage-locale") || "en";
          document.documentElement.lang = locale === "zh" ? "zh-CN" : locale === "ja" ? "ja" : "en";
          var savedTheme = query.get("theme") || localStorage.getItem("sichen-homepage-theme") || "tohoku";
          var theme = themeCatalog[savedTheme] ? savedTheme : "tohoku";
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeCatalog[theme]);
        } catch {
          document.documentElement.lang = "en";
          document.documentElement.dataset.theme = "tohoku";
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260515-175231" />
    <link rel="stylesheet" href="/assets/shared/homepage-shell.css?v=20260515-175231" />
    <link rel="stylesheet" href="/assets/shared/homepage-frame.css?v=20260515-175231" />
    <script src="./data/youtube-to-ebook-data.js?v=20260515-175231"></script>
    <script src="/assets/shared/homepage-i18n.js?v=20260515-175231"></script>
    <script src="/assets/shared/homepage-platform.js?v=20260515-175231"></script>
    <script src="/assets/shared/homepage-components.js?v=20260515-175231"></script>
    <script defer src="/assets/shared/homepage-shell.js?v=20260515-175231"></script>
    <script defer src="./app.js?v=20260515-175231"></script>
  </head>
  <body data-page="youtube-to-ebook">
    <div class="page-wash"></div>

    <header class="shell site-header">
      <div class="header-tools">
        <a class="fb-site-brand" href="./index.html" aria-label="YouTube Learner">
          <span>YouTube Learner</span>
          <small data-i18n="brand.note">Watch YouTube. Read along. Learn better.</small>
        </a>
        <div class="header-controls-anchor" aria-hidden="true"></div>
        <div class="header-controls" aria-label="Display controls">
          <div class="locale-switcher control-switcher" role="group" aria-label="Language"></div>
          <div class="theme-switcher control-switcher" role="group" aria-label="Color theme"></div>
        </div>
        <nav class="topnav" aria-label="Page navigation">
          <a href="./index.html#feed" aria-current="page">
            <svg class="ui-icon" aria-hidden="true"><use href="/academic-homepage/assets/icons/ui-icons.svg#icon-publications"></use></svg>
            <span data-i18n="nav.feed">Home</span>
          </a>
          <a href="./index.html#github">
            <svg class="ui-icon" aria-hidden="true"><use href="/academic-homepage/assets/icons/ui-icons.svg#icon-code"></use></svg>
            <span data-i18n="nav.github">GitHub</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="fb-layout">
      <section class="fb-toolbar reveal" aria-label="Feed controls">
        <div class="fb-search">
          <svg class="ui-icon" aria-hidden="true"><use href="/academic-homepage/assets/icons/ui-icons.svg#icon-keyword"></use></svg>
          <input id="fb-search" type="search" placeholder="Search learning articles, sources, or workflows" />
        </div>
      </section>

      <section id="feed" class="fb-feed-page reveal" aria-label="YouTube Learner article feed">
        <div class="fb-feed-grid">
          <section class="fb-main-column" aria-labelledby="fb-feed-title">
            <div class="fb-section-head">
              <h2 id="fb-feed-title" data-i18n="feed.title">Learning articles</h2>
              <div class="fb-heading-actions">
                <div id="fb-language-display" class="fb-language-display" role="group" aria-label="Displayed languages"></div>
                <button id="fb-reset" class="fb-icon-button" type="button" data-fb-display-reset="all" aria-label="Reset filters" title="Reset filters">
                  <svg class="ui-icon" aria-hidden="true"><use href="/academic-homepage/assets/icons/ui-icons.svg#icon-reset"></use></svg>
                </button>
              </div>
            </div>
            <div id="fb-story-list" class="fb-story-list"></div>
          </section>

          <aside class="fb-rail" id="sources" aria-labelledby="fb-sources-title">
            <section class="fb-rail-section">
              <h2 id="fb-sources-title" data-i18n="sources.title">Library context</h2>
              <div id="fb-source-stats" class="fb-source-stats"></div>
            </section>
            <section class="fb-rail-section">
              <h3 data-i18n="sources.channels">Seed channels</h3>
              <div id="fb-builder-list" class="fb-source-list"></div>
            </section>
            <section class="fb-rail-section">
              <h3 data-i18n="sources.pipeline">Pipeline services</h3>
              <div id="fb-podcast-list" class="fb-source-list"></div>
            </section>
            <section class="fb-rail-section">
              <h3 data-i18n="sources.outputs">Output formats</h3>
              <div id="fb-blog-list" class="fb-source-list"></div>
            </section>
            <section class="fb-rail-section yte-boundary-section">
              <h3 data-i18n="sources.modules">Upstream modules</h3>
              <div id="yte-module-list" class="fb-source-list"></div>
            </section>
            <section class="fb-rail-section fb-github-section" id="github">
              <h3 data-i18n="github.title">GitHub</h3>
              <div class="fb-github-list">
                <a class="fb-github-card" href="https://github.com/zarazhangrui/youtube-to-ebook">
                  <strong data-i18n="github.upstreamTitle">Zara Zhang</strong>
                  <span data-i18n="github.upstreamText">Original youtube-to-ebook project</span>
                </a>
                <a class="fb-github-card" href="https://github.com/SichenTao">
                  <strong data-i18n="github.sichenTitle">Sichen Tao</strong>
                  <span data-i18n="github.sichenText">Homepage and research workspace</span>
                </a>
              </div>
            </section>
          </aside>
        </div>
      </section>

      <article id="article" class="fb-article-page reveal" hidden aria-live="polite"></article>
    </main>
  </body>
</html>
